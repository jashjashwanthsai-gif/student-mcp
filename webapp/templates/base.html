<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Adaptive MCP{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif; background-color: #0A0B0F; }
    .font-tech { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    a, button { outline-offset: 2px; }
    a:focus-visible, button:focus-visible { outline: 2px solid rgb(52 211 153); }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#0A0B0F] text-zinc-400 antialiased min-h-screen">
  <nav class="max-w-2xl mx-auto flex items-center justify-between px-6 py-7">
    <a href="/" class="flex items-center gap-2 text-white font-semibold tracking-tight">
      <span class="w-6 h-6 rounded-md bg-gradient-to-br from-emerald-400 to-teal-600 ring-1 ring-white/20"></span>
      Student Adaptive MCP
    </a>
    {% if user %}
      <form method="post" action="/logout" class="flex items-center gap-3 m-0">
        <span class="font-tech text-xs text-zinc-500">{{ user.email }}</span>
        <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-medium text-zinc-300 border border-white/10 hover:bg-white/5 transition">Log out</button>
      </form>
    {% else %}
      <div class="flex items-center gap-2">
        <a href="/login" class="px-4 py-2 rounded-lg text-sm font-medium text-zinc-300 hover:bg-white/5 transition">Log in</a>
        <a href="/signup" class="px-4 py-2 rounded-lg text-sm font-semibold text-zinc-950 bg-white ring-1 ring-white/20 hover:opacity-90 transition">Sign up</a>
      </div>
    {% endif %}
  </nav>
  <main class="max-w-2xl mx-auto px-6 pb-24">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
