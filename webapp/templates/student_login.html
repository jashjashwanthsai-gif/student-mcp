<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student login - Student Adaptive MCP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif; background-color: #0A0B0F; }
    .font-tech { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    a, button { outline-offset: 2px; }
    a:focus-visible, button:focus-visible { outline: 2px solid rgb(52 211 153); }
  </style>
</head>
<body class="bg-[#0A0B0F] text-zinc-400 antialiased min-h-screen">

  <nav class="max-w-2xl mx-auto flex items-center justify-between px-6 py-7">
    <a href="/" class="flex items-center gap-2 text-white font-semibold tracking-tight">
      <span class="w-6 h-6 rounded-md bg-gradient-to-br from-emerald-400 to-teal-600 ring-1 ring-white/20"></span>
      Student Adaptive MCP
    </a>
  </nav>

  <main class="max-w-sm mx-auto px-6 pb-24">
    <div class="mt-10 rounded-2xl border border-white/[0.08] bg-[#12151C]/80 backdrop-blur p-8 shadow-xl shadow-black/20">
      <h2 class="text-xl font-bold tracking-tight text-white mb-1">Your progress</h2>
      <p class="text-sm text-zinc-500 mb-6">Log in with the username and password your parent/tutor gave you.</p>
      <form method="post" action="/student-login">
        <label class="font-tech block text-xs uppercase tracking-wider text-zinc-500 mb-2">Username</label>
        <input type="text" name="username" required autocomplete="username"
          class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/30 transition">

        <label class="font-tech block text-xs uppercase tracking-wider text-zinc-500 mb-2 mt-5">Password</label>
        <input type="password" name="password" required autocomplete="current-password"
          class="w-full bg-black/30 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/30 transition">

        {% if error %}<p class="text-red-400 text-sm mt-3">{{ error }}</p>{% endif %}

        <button type="submit"
          class="w-full mt-6 inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-semibold text-white bg-gradient-to-b from-emerald-400 to-emerald-600 ring-1 ring-white/20 shadow-lg shadow-emerald-500/10 hover:opacity-90 active:scale-[0.98] transition">
          Log in
        </button>
      </form>
    </div>
    <p class="text-sm text-zinc-600 mt-6 text-center">Parent, tutor, or teacher? <a href="/login" class="text-zinc-400 hover:text-zinc-200">Log in to your account</a></p>
  </main>

</body>
</html>
